image:
  repository: postgres
  tag: "17-alpine"

service:
  port: 5432

livenessProbe:
  exec:
    command:
      - pg_isready
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  exec:
    command:
      - pg_isready
  initialDelaySeconds: 5
  periodSeconds: 10

env:
  - name: POSTGRES_DB
    value: "mydb"
  - name: POSTGRES_USER
    value: "myuser"
  - name: POSTGRES_PASSWORD
    value: "mypassword"

volumeMounts:
  - name: postgres-data
    mountPath: /var/lib/postgresql/data

volumes:
  - name: postgres-data
    persistentVolumeClaim:
      claimName: postgres-pvc
