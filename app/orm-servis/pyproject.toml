[project]
name = "orm-server"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi[standard]>=0.115.12",
    "pydantic-settings>=2.9.1",
    "sqlalchemy>=2.0.41",
    "python-jose>=3.4.0",
    "uuid6>=2024.7.10",
    "passlib[bcrypt]>=1.7.4",
    "typer>=0.16.0",
    "redis>=6.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orm-server"]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "nox[uv]>=2025.5.1",
    "ruff>=0.11.10",
]

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
    "env",
    "migrations",
]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "N", "I", "C"]
ignore = ["E203", "W293", "B008"]
per-file-ignores = { "__init__.py" = ["F401"] }
fixable = ["ALL"]

[tool.ruff.format]
line-ending = "auto"
docstring-code-line-length = "dynamic"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
strict = true
warn_unused_configs = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
