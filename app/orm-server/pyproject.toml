[project]
name = "orm-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0.41",
    "uuid6>=2024.7.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orm-server"]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "nox[uv]>=2025.5.1",
    "ruff>=0.11.10",
]
