[project]
name = "orm-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=24.1.0",
    "grpcio>=1.71.0",
    "sqlalchemy>=2.0.41",
    "uuid6>=2024.7.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orm-server"]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "mypy-protobuf>=3.6.0",
    "nox[uv]>=2025.5.1",
    "ruff>=0.11.10",
    "types-aiofiles>=24.1.0.20250516",
    "types-protobuf>=6.30.2.20250516",
]

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
    "env",
    "migrations",
    "*_pb2.py",
    "*_pb2_grpc.py",
    "*_pb2.pyi",
]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "N", "I", "C"]
ignore = ["E203", "W293", "N802"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"shared/grpc_stubs/*" = ["E402", "E501", "F401", "I001", "F541"]

[tool.ruff.format]
line-ending = "auto"
docstring-code-line-length = "dynamic"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
strict = true
warn_unused_configs = true
explicit_package_bases = true
packages = ["db", "services", "shared"]
plugins = ["sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = "src.services.user_service"
ignore_errors = true
