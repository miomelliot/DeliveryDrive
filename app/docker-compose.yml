############################################################
# DeliveryDrive ─ Core Compose
# ----------------------------------------------------------
# * db         → PostgreSQL 16 (persistent)
# * orm-servis → REST/FastAPI‑based domain service
# * seed       → one‑shot task that initialises/seed DB using
#                src/db/init_db.py from the same image.
#                Useful for CI/CD or local bootstrap.
############################################################
services:
  db:
    image: postgres:16-alpine
    container_name: deliverydrive-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: deliverydrive
      POSTGRES_PASSWORD: deliverydrive
      POSTGRES_DB: deliverydrive
      TZ: Europe/Moscow
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # ORM application (async FastAPI + SQLAlchemy engine)
  orm-servis:
    build:
      context: ./orm-servis
    container_name: orm-servis
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql+asyncpg://deliverydrive:deliverydrive@db:5432/deliverydrive"
      TZ: Europe/Moscow
    volumes:
      - ./orm-servis/static:/app/static
    command: >-
      bash -c "python -m src.db.init_db && uv run src/run_grpc.py"
    ports:
      - "8001:8000"

  seed-db:
    build:
      context: ./orm-servis
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql+asyncpg://deliverydrive:deliverydrive@db:5432/deliverydrive"
    command: python -m src.db.init_db
    restart: "no"

volumes:
  db_data:
   
