[project]
name = "api-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "grpcio>=1.71.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api-server"]

[dependency-groups]
dev = [
    "grpcio-tools>=1.71.0",
    "mypy>=1.15.0",
    "nox[uv]>=2025.5.1",
    "ruff>=0.11.10",
]
