services:
  db:
    image: postgres:16-alpine
    container_name: deliverydrive-db
    restart: unless-stopped
    environment:
      POSTGRES_USER       : deliverydrive
      POSTGRES_PASSWORD   : deliverydrive
      POSTGRES_DB         : deliverydrive
      TZ                  : Europe/Moscow
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  orm-servis:
    build:
      context: ./app/orm-servis
    image: deliverydrive/orm-servis:latest
    container_name: orm-servis
    depends_on: [db]
    restart: unless-stopped
    environment:
      POSTGRES_USER       : deliverydrive
      POSTGRES_PASSWORD   : deliverydrive
      POSTGRES_HOST       : db
      POSTGRES_PORT       : 5432
      POSTGRES_DB         : deliverydrive
      TZ                  : Europe/Moscow
      JWT_SECRET          : "change-this-in-prod"
      JWT_ALG             : "HS256"
      ACCESS_TOKEN_TTL_MIN: 43200  # 30 дней
    volumes:
      - ./app/orm-servis/static:/app/static
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8080:8000"

  auth-servis:
    build:
      context: ./app/auth-servis
    image: deliverydrive/auth-servis:latest
    container_name: auth-servis
    depends_on: [db]
    restart: unless-stopped
    environment:
      POSTGRES_USER       : deliverydrive
      POSTGRES_PASSWORD   : deliverydrive
      POSTGRES_HOST       : db
      POSTGRES_PORT       : 5432
      POSTGRES_DB         : deliverydrive
      TZ                  : Europe/Moscow
      JWT_SECRET          : "change-this-in-prod"
      JWT_ALG             : "HS256"
      ACCESS_TOKEN_TTL_MIN: 43200  # 30 дней
    command: uvicorn src.main:app --host 0.0.0.0 --port 9000
    ports:
      - "9090:9000"

  seed-db:
    image: deliverydrive/orm-servis:latest
    depends_on: [db]
    environment:
      POSTGRES_USER       : deliverydrive
      POSTGRES_PASSWORD   : deliverydrive
      POSTGRES_HOST       : db
      POSTGRES_PORT       : 5432
      POSTGRES_DB         : deliverydrive
    command: python -m src.db.init_db
    restart: "no"

volumes:
  db_data:

