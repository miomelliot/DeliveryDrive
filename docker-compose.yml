services:
  db:
    image: postgres:16-alpine
    container_name: deliverydrive-db
    restart: unless-stopped
    environment:
      POSTGRES_USER       : deliverydrive
      POSTGRES_PASSWORD   : deliverydrive
      POSTGRES_DB         : deliverydrive
      TZ                  : Europe/Moscow
    ports:
      - "5432:5432"
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=cp %p /var/lib/postgresql/data/pg_wal/%f
      - -c
      - wal_level=replica
    volumes:
      - db_data:/var/lib/postgresql/data

  orm-service:
    build:
      context: ./app/orm-service
    image: deliverydrive/orm-service:latest
    container_name: orm-service
    depends_on: [db]
    restart: unless-stopped
    environment:
      POSTGRES_USER       : deliverydrive
      POSTGRES_PASSWORD   : deliverydrive
      POSTGRES_HOST       : db
      POSTGRES_PORT       : 5432
      POSTGRES_DB         : deliverydrive
      TZ                  : Europe/Moscow
      JWT_SECRET          : "change-this-in-prod"
      JWT_ALG             : "HS256"
      OSRM_SERVICE_URL    : http://osrm-service:8000
      ACCESS_TOKEN_TTL_MIN: 43200  # 30 дней
    volumes:
      - ./app/orm-service/static:/app/static
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8080:8000"

  auth-service:
    build:
      context: ./app/auth-service
    image: deliverydrive/auth-service:latest
    container_name: auth-service
    depends_on: [db]
    restart: unless-stopped
    environment:
      POSTGRES_USER       : deliverydrive
      POSTGRES_PASSWORD   : deliverydrive
      POSTGRES_HOST       : db
      POSTGRES_PORT       : 5432
      POSTGRES_DB         : deliverydrive
      TZ                  : Europe/Moscow
      JWT_SECRET          : "change-this-in-prod"
      JWT_ALG             : "HS256"
      ACCESS_TOKEN_TTL_MIN: 43200  # 30 дней
    command: uvicorn src.main:app --host 0.0.0.0 --port 9000
    ports:
      - "9090:9000"

  seed-db:
    image: deliverydrive/orm-service:latest
    depends_on: [db]
    environment:
      POSTGRES_USER       : deliverydrive
      POSTGRES_PASSWORD   : deliverydrive
      POSTGRES_HOST       : db
      POSTGRES_PORT       : 5432
      POSTGRES_DB         : deliverydrive
    command: python -m src.db.init_db
    restart: "no"

  nominatim:
    image: mediagis/nominatim:5.1
    shm_size: 1g
    environment:
      PBF_URL: https://download.bbbike.org/osm/bbbike/Moscow/Moscow.osm.pbf
      IMPORT_WIKIPEDIA: "false"
      NOMINATIM_PASSWORD: strongpass
    volumes:
      - nominatim-db:/var/lib/postgresql/15/main
    ports:
      - "7070:8080"
      
  neo4j:
    image: neo4j:5.19.0-community
    container_name: neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: 2G
      NEO4J_dbms_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-changeme}", "RETURN 1"]
      interval: 30s
      retries: 10

  osrm-backend:
    build:
      context: ./app/osrm_backend
      args:
        PBF_URL: https://download.bbbike.org/osm/extract/planet_37.427_55.547_bec2b658.osm.pbf
    container_name: osrm-backend
    restart: unless-stopped
    volumes:
      - ./data/osrm:/data
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/route/v1/driving/13.388860,52.517037;13.397634,52.529407"]
      interval: 30s
      timeout: 3s
      retries: 5

  osrm-service:
    build:
      context: ./app/osrm-service
    image: deliverydrive/osrm-service:latest
    container_name: osrm-service
    depends_on:
      - db
      - neo4j
      - osrm-backend
    restart: unless-stopped
    environment:
      POSTGRES_USER       : deliverydrive
      POSTGRES_PASSWORD   : deliverydrive
      POSTGRES_HOST       : db
      POSTGRES_PORT       : 5432
      POSTGRES_DB         : deliverydrive
      ### Neo4j
      NEO4J_USER          : neo4j
      NEO4J_PASSWORD      : changeme
      NEO4J_HOST          : neo4j
      NEO4J_PORT          : 7687
      NEO4J_SCHEME        : bolt
      ### OSRM
      OSRM_URL            : http://osrm-backend:5000
      ### App
      TZ                  : Europe/Moscow
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    ports: ["6060:8000"]
    deploy:
      resources:
        limits:
          cpus: '6.0'

volumes:
  db_data:
  nominatim-db:
  neo4j_data:
  neo4j_logs:


